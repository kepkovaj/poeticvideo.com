<textarea name="beginer_text" cols="20" rows="5" readonly="readonly" id="beginer_text">BEGINNER VIDEO CLASSES - For Beginner Video Class program please download the PDF file.
The Beginner Video Class will teach you everything you need to know to get better shots with your camcorder, preparing you to make your home videos look more professional. This class will expose you to the mechanical functions of the video camera and give you some basic instructions in shooting techniques to avoid beginner mistakes that nearly everyone makes when they pick up a video camera. Lessons are designed for owners of camcorders who want to know what all the buttons and features are for, how to handle difficult situations when shooting a home video, when to use automatic controls, when it is best to use manual controls, how to use the tripod, monopod and when to use a hand-held camera, how to deal with a sunny day or low light situation, how to set up white balance, what the basic camera movements are, and how to output your video on a DVD or post it on the internet. You can bring your camcorder to the class. You can learn with whatever camera you can get your hands on. They all have similar controls and all do the job of capturing the light. There will be plenty of samples from various films and students' videos to review and discuss. After completion of this class people will be impressed with your improved video-making skills. You'll be surprised at how just a small amount of attention to the right details can make a tremendous difference in the ability of your videos to communicate your message. Each Beginner Video Class is held once a week for four consecutive weeks and runs from 6:30 PM to 8:30 PM. Address: Poetic Video Classroom, 174 Avenue C, 2-nd floor, Williston, VT 05495. For location map of video classes please click the LOCATION menu button. Register today by clicking the REGISTER menu button!</textarea>
   
<textarea name="advanced_Text" cols="20" rows="5" readonly="readonly" id="advanced_Text">ADVANCED VIDEO CLASSES - For Advanced Video Class program please download the PDF file.
If you're a seasoned veteran, and you want to go further this class for advanced videographers is your choice. We will go much deeper and talk about video camera movement, how to plane your shoots, what the specifics of common events are, about lighting and composition, all aspects of montage, transitions, special effects and editing software. There will be plenty of hands-on exercises and appropriate time for questions and discussions. Whatever your level of experience is, I'm here to help. Remember that the purpose of this training is to learn how to make the best video. Each Advanced Video Class is held once a week for four consecutive weeks and runs from 6:30 PM to 8:30 PM. Address: Poetic Video Classroom, 174 Avenue C, 2-nd floor, Williston, VT 05495. For location map of video classes please click the LOCATION menu button. Register today by clicking the REGISTER menu button! </textarea>
